<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Shop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#4b342d;color:#fff}
.hero{
height:70vh;
background:url("https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=1600&q=80") center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
.hero div{background:rgba(0,0,0,.45);padding:30px}
.hero h1{font-size:50px}
.hero button{margin-top:20px;padding:12px 30px;background:#d8a15d;border:none;color:#fff;cursor:pointer}

.features{
display:flex;
justify-content:space-around;
background:#fff;
color:#333;
padding:20px;
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:40px;
}

.card{
background:#fff;
color:#333;
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{padding:10px}
.card p{padding-bottom:15px;color:#8b5a2b;font-weight:bold}

footer{
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<section class="hero">
<div>
<h1>We are Delicious<br>Chocolate</h1>
<button>SEE OUR OFFER</button>
</div>
</section>

<div class="features">
<div>🍫 Premium Shop</div>
<div>🔔 Notifications</div>
<div>🚚 Worldwide Shipping</div>
</div>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/250x220">
<h3>Chocolate Cake</h3>
<p>$23.00</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x220">
<h3>Tasty Chocolate</h3>
<p>$23.00</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x220">
<h3>Delicious Cake</h3>
<p>$23.00</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x220">
<h3>Chocolate Box</h3>
<p>$23.00</p>
</div>

</section>

<footer>
© 2026 Chocolate Shop
</footer>

</body>
</html>
