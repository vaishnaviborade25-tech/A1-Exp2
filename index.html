<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Shop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#2d1608;color:#fff}
nav{display:flex;justify-content:space-between;padding:20px 10%;background:#1b0d06}
nav a{color:#fff;text-decoration:none;margin-left:20px}
.hero{text-align:center;padding:100px 20px;background:#4b2c20}
.hero h1{font-size:50px}
.hero p{margin:15px 0}
.btn{display:inline-block;padding:10px 25px;background:gold;color:#000;text-decoration:none;border-radius:25px}
.products{padding:50px 10%;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.card{background:#3a2012;padding:20px;border-radius:10px;width:220px;text-align:center}
.card img{width:100%;border-radius:10px}
footer{text-align:center;padding:20px;background:#1b0d06}
</style>

</head>
<body>

<nav>
<h2>🍫 Choco</h2>
<div>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</div>
</nav>

<section class="hero">
<h1>Premium Chocolate</h1>
<p>Fresh, handmade chocolates for every occasion.</p>
<a href="#" class="btn">Shop Now</a>
</section>

<section class="products">
<div class="card">
<img src="https://via.placeholder.com/220x150" alt="Chocolate">
<h3>Dark Chocolate</h3>
<p>$12.99</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/220x150" alt="Chocolate">
<h3>Milk Chocolate</h3>
<p>$10.99</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/220x150" alt="Chocolate">
<h3>Gift Box</h3>
<p>$24.99</p>
</div>
</section>

<footer>
<p>© 2026 Chocolate Shop. All Rights Reserved.</p>
</footer>

</body>
</html>
